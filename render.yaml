services:
  - type: web
    name: campuseats-api-it24103900
    runtime: docker
    plan: free
    rootDir: CampusEats-Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: CampusEats
      - key: Jwt__Audience
        value: CampusEatsUsers
      - key: Frontend__Origin
        sync: false
  - type: web
    name: campuseats-web-it24103900
    runtime: static
    buildCommand: npm --prefix CampusEats-Frontend ci && npm --prefix CampusEats-Frontend run build
    staticPublishPath: CampusEats-Frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://campuseats-api-it24103900.onrender.com
